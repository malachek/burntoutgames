  <!--
    Sveltia CMS. Loads from a CDN, so there is nothing to install and nothing to
    build. It reads the field definitions in config.yml and writes changes
    straight back to the GitHub repository, which triggers a Cloudflare Pages
    rebuild. Roughly 60 seconds from "Publish" to live.

    Sveltia reads the Decap CMS config format, so if you ever want to switch,
    swap this one script tag for Decap's and config.yml keeps working.
  -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
